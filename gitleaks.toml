title = "strata-agent secret scan"

# 继承 gitleaks 内置规则集；仓库不另维护一套正则。
[extend]
useDefault = true

# 不配置 allowlist：
# 1) 内置规则已不会把 `<...>`、`${...}`、`your-...` 这类占位当作凭证（2026-11-13 实测）；
# 2) allowlist 的 regexes 默认匹配“密钥值”而非整行，按整行写的正则不会生效，容易造成“已豁免”的错觉；
# 3) 不按目录放行——一旦放行目录，该目录下新增的真实密钥会被静默跳过。
# 出现误报时，用精确到值的单条 regex 添加，并在 PR 中写明理由。
