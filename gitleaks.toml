title = "strata-agent secret scan"

# 继承 gitleaks 内置规则集；不要在仓库内另维护一套正则。
[extend]
useDefault = true

[allowlist]
description = "最小豁免：仅覆盖文档中明确标注为占位符的写法"
# 只放行三种占位形式：<...>、${...}、your-...。真实密钥不会长成这三种形状。
# 不使用 paths 豁免：一旦按目录放行，该目录下新增的真实密钥会被静默跳过。
regexes = [
  '''(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*["']?(<[^>]+>|\$\{[^}]+\}|your[-_][\w-]+)''',
]
